<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">FA-ReID: structure-guided feature alignment</title>
  <desc id="desc">Illustrative method summary based on the published paper. RGB appearance and human-parsing features meet through multi-scale cross-attention. Identity learning is paired with a clothing adversarial training objective. The silhouettes and feature blocks are schematic, not experimental outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#738190"/></marker>
    <marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b7787d"/></marker>
    <g id="person">
      <circle cx="0" cy="-67" r="16"/>
      <path d="M-23-41Q0-53 23-41L35 14 22 18 14-12 15 39 25 91 8 94 0 49-8 94-25 91-15 39-14-12-22 18-35 14Z"/>
    </g>
    <g id="features">
      <rect x="0" y="0" width="52" height="66" rx="4" fill="currentColor" opacity=".22"/>
      <rect x="15" y="-11" width="52" height="66" rx="4" fill="currentColor" opacity=".38"/>
      <rect x="30" y="-22" width="52" height="66" rx="4" fill="currentColor" opacity=".65"/>
      <path d="M39-7h34M39 3h34M39 13h34M39 23h34" stroke="white" stroke-width="2" opacity=".55"/>
    </g>
  </defs>
  <rect width="1200" height="690" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#283948">
    <text x="36" y="48" font-size="29" font-weight="700">Appearance changes. Identity persists.</text>
    <text x="36" y="80" font-size="18" fill="#7a8490">RGB + human parsing · multi-scale cross-attention · adversarial learning</text>
    <rect x="28" y="112" width="262" height="522" rx="17" fill="#f6f8fb" stroke="#e3e8ed" stroke-width="2"/>
    <text x="159" y="148" text-anchor="middle" font-size="20" font-weight="700">Complementary inputs</text>
    <rect x="48" y="169" width="222" height="212" rx="12" fill="#edf3f9"/>
    <use href="#person" transform="translate(113 270) scale(.88)" fill="#7898b8"/>
    <use href="#person" transform="translate(211 270) scale(.88)" fill="#bd9b83"/>
    <text x="159" y="365" text-anchor="middle" font-size="19" fill="#4f6a85">RGB appearance</text>
    <rect x="48" y="399" width="222" height="211" rx="12" fill="#f0edf7"/>
    <use href="#person" transform="translate(113 499) scale(.88)" fill="#a492c6"/>
    <use href="#person" transform="translate(211 499) scale(.88)" fill="#a492c6"/>
    <g stroke="#fff" stroke-width="4"><path d="M85 511h54M183 511h54M101 471v39M199 471v39M113 548v32M211 548v32"/></g>
    <text x="159" y="593" text-anchor="middle" font-size="19" fill="#766294">Human-parsing structure</text>
    <g fill="none" stroke="#738190" stroke-width="3" marker-end="url(#arrow)">
      <path d="M291 269H342"/><path d="M291 499H342"/>
      <path d="M474 269H536"/><path d="M474 499H510V405H536"/>
      <path d="M805 338H861"/>
      <path d="M954 338H977V248H1003"/>
      <path d="M954 338H977V499H1003" stroke="#b7787d" marker-end="url(#red-arrow)"/>
    </g>
    <use href="#features" transform="translate(359 251)" color="#6e94b8"/>
    <use href="#features" transform="translate(359 481)" color="#9c89bf"/>
    <text x="400" y="342" text-anchor="middle" font-size="18" fill="#6a7785">RGB features</text>
    <text x="400" y="572" text-anchor="middle" font-size="18" fill="#6a7785">Structural features</text>
    <rect x="536" y="198" width="270" height="288" rx="18" fill="#f6f0df" stroke="#d8c493" stroke-width="2"/>
    <text x="671" y="235" text-anchor="middle" font-size="21" font-weight="700">Multi-Scale</text>
    <text x="671" y="263" text-anchor="middle" font-size="21" font-weight="700">Cross-Attention</text>
    <g stroke="#bea972" stroke-width="2" opacity=".8">
      <path d="M577 317L630 343 684 317 760 362M577 359L630 343 684 392 760 362M577 401L630 383 684 357 760 403M577 317L684 392M630 383L760 362"/>
    </g>
    <g fill="#b49a60"><circle cx="577" cy="317" r="8"/><circle cx="577" cy="359" r="8"/><circle cx="577" cy="401" r="8"/><circle cx="630" cy="343" r="10"/><circle cx="630" cy="383" r="10"/><circle cx="684" cy="317" r="8"/><circle cx="684" cy="357" r="8"/><circle cx="684" cy="392" r="8"/><circle cx="760" cy="362" r="10"/><circle cx="760" cy="403" r="8"/></g>
    <text x="671" y="453" text-anchor="middle" font-size="18" fill="#8e7c50">Structure guides appearance</text>
    <use href="#features" transform="translate(866 320)" color="#6d9c94"/>
    <text x="906" y="421" text-anchor="middle" font-size="18" fill="#5d837d">Aligned</text>
    <text x="906" y="444" text-anchor="middle" font-size="18" fill="#5d837d">identity features</text>
    <rect x="1003" y="184" width="171" height="135" rx="14" fill="#edf5f0" stroke="#b4d0c0" stroke-width="2"/>
    <text x="1088" y="235" text-anchor="middle" font-size="21" font-weight="700">Identity</text>
    <text x="1088" y="264" text-anchor="middle" font-size="21" font-weight="700">learning</text>
    <rect x="1003" y="431" width="171" height="139" rx="14" fill="#f9eeee" stroke="#dfbdc0" stroke-width="2"/>
    <text x="1088" y="469" text-anchor="middle" font-size="20" font-weight="700">Clothing</text>
    <text x="1088" y="496" text-anchor="middle" font-size="20" font-weight="700">adversary</text>
    <text x="1088" y="537" text-anchor="middle" font-size="17" fill="#a06e74">GRL + entropy</text>
    <path d="M1088 571V604H671V486" fill="none" stroke="#b7787d" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#red-arrow)"/>
    <text x="875" y="629" text-anchor="middle" font-size="17" fill="#a06e74">Suppress clothing dependence during training</text>
    <text x="36" y="669" font-size="15" fill="#99a1aa" letter-spacing="2">ILLUSTRATIVE METHOD OVERVIEW</text>
  </g>
</svg>
