<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">Different bodies, shared tasks: pushing and blowing for particle collection</title>
  <desc id="desc">Illustrative schematic of the Columbia course project. A fixed blower moves scattered particles over a broad region while a mobile pusher uses local contact to collect them at a receptacle. Spatial Action Maps and single-frequency Deep Q-Learning provide the action representation and learner. Experiments vary capabilities, blower placement, and agent count. The arrows illustrate the intended mechanism, not measured trajectories or quantitative outcomes. The lower-right area is reserved for an original simulation preview.</desc>
  <defs>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#fafbfd"/><stop offset="1" stop-color="#edf2f6"/></linearGradient>
    <linearGradient id="air" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#57a5aa" stop-opacity=".25"/><stop offset="1" stop-color="#82c2bc" stop-opacity=".02"/></linearGradient>
    <linearGradient id="cube" x2="0" y2="1"><stop stop-color="#edf1f6"/><stop offset="1" stop-color="#c5cfdc"/></linearGradient>
    <linearGradient id="body" x2="1" y2="1"><stop stop-color="#556a88"/><stop offset="1" stop-color="#273e5c"/></linearGradient>
    <marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#438f95"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#5671aa"/></marker>
    <marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8492a6"/></marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dce4ed" stroke-width="1"/></pattern>
    <g id="particle"><circle r="4.2" fill="#cfaa61" stroke="#b9944e" stroke-width=".7"/><circle cx="-1" cy="-1" r="1.2" fill="#f0dcac"/></g>
    <g id="blower">
      <ellipse cy="19" rx="36" ry="13" fill="#324a64" opacity=".11"/>
      <rect x="-28" y="-21" width="56" height="45" rx="10" fill="url(#body)"/>
      <rect x="-33" y="-10" width="8" height="30" rx="3" fill="#1b2c43"/><rect x="25" y="-10" width="8" height="30" rx="3" fill="#1b2c43"/>
      <circle cy="-1" r="17" fill="#d7e7ea" stroke="#3d777e" stroke-width="3"/>
      <path d="M0-13C9-16 16-4 5 0 11 8 0 19-3 6-13 12-20 0-7-3-11-13-1-19 0-6Z" fill="#5c9a9e"/>
      <circle r="4.5" fill="#35546a"/><path d="M-11-23 0-40 11-23Z" fill="#6daeb2"/>
    </g>
    <g id="pusher">
      <ellipse cy="21" rx="36" ry="13" fill="#324a64" opacity=".12"/>
      <rect x="-27" y="-27" width="54" height="55" rx="11" fill="url(#body)"/>
      <rect x="-32" y="-17" width="8" height="37" rx="3" fill="#1b2c43"/><rect x="24" y="-17" width="8" height="37" rx="3" fill="#1b2c43"/>
      <rect x="-35" y="-37" width="70" height="12" rx="3" fill="#a9b9ca" stroke="#607890" stroke-width="2"/>
      <rect x="-12" y="-13" width="24" height="23" rx="5" fill="#7893ae"/><circle cx="0" cy="-4" r="6" fill="#bed9de"/>
    </g>
    <g id="obstacle">
      <path d="M0 18 74 18 100 41 25 41Z" fill="#8494aa" opacity=".13"/>
      <path d="M0-35 55-35 75-54 20-54Z" fill="#f8fafd" stroke="#c5cedb" stroke-width="2"/>
      <path d="M0-35H55V20H0Z" fill="url(#cube)" stroke="#b7c3d2" stroke-width="2"/>
      <path d="M55-35 75-54V1L55 20Z" fill="#afbed0" stroke="#a3b3c8" stroke-width="2"/>
    </g>
  </defs>
  <rect width="1120" height="760" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#24394e">
    <text x="26" y="37" font-size="28" font-weight="700">Complementary capabilities. One collection task.</text>
    <text x="26" y="66" font-size="18" fill="#758397">Heterogeneous non-prehensile manipulation in PyBullet</text>

    <!-- Illustrative workspace: local contact and pneumatic influence share a target. -->
    <rect x="24" y="92" width="650" height="458" rx="24" fill="url(#floor)" stroke="#d5dfe9" stroke-width="2"/>
    <rect x="40" y="107" width="618" height="428" rx="14" fill="url(#grid)"/>
    <path d="M48 518V119H638" fill="none" stroke="#becbd9" stroke-width="13" stroke-linejoin="round"/>
    <path d="M48 518H638V119" fill="none" stroke="#d5dee8" stroke-width="9" stroke-linejoin="round"/>
    <rect x="556" y="123" width="80" height="76" rx="7" fill="#d7857d" stroke="#bb655e" stroke-width="2"/>
    <path d="M560 138H631" stroke="#f2c8be" stroke-width="4"/>
    <text x="595" y="155" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">TARGET</text>
    <text x="595" y="176" text-anchor="middle" font-size="13" fill="#fff">receptacle</text>

    <path d="M111 427C100 312 175 209 337 193L417 325C294 327 245 384 194 461Z" fill="url(#air)"/>
    <path d="M137 413C163 332 231 271 337 261" fill="none" stroke="#66aaa9" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#teal)"/>
    <path d="M161 439C206 366 268 330 360 325" fill="none" stroke="#438f95" stroke-width="5" marker-end="url(#teal)"/>
    <path d="M118 388C130 296 181 229 269 208" fill="none" stroke="#8cbfba" stroke-width="2.5" marker-end="url(#teal)"/>

    <g opacity=".94">
      <use href="#particle" x="81" y="170"/><use href="#particle" x="101" y="199"/><use href="#particle" x="74" y="263"/>
      <use href="#particle" x="95" y="319"/><use href="#particle" x="68" y="355"/><use href="#particle" x="83" y="479"/>
      <use href="#particle" x="206" y="157"/><use href="#particle" x="254" y="141"/><use href="#particle" x="402" y="153"/>
      <use href="#particle" x="500" y="218"/><use href="#particle" x="535" y="263"/><use href="#particle" x="604" y="339"/>
      <use href="#particle" x="564" y="467"/><use href="#particle" x="512" y="498"/><use href="#particle" x="319" y="465"/>
      <use href="#particle" x="328" y="293"/><use href="#particle" x="340" y="302"/><use href="#particle" x="351" y="287"/>
      <use href="#particle" x="363" y="309"/><use href="#particle" x="373" y="292"/><use href="#particle" x="382" y="315"/>
      <use href="#particle" x="354" y="327"/><use href="#particle" x="388" y="281"/><use href="#particle" x="406" y="307"/>
      <use href="#particle" x="380" y="335"/><use href="#particle" x="409" y="329"/><use href="#particle" x="421" y="292"/>
      <use href="#particle" x="367" y="269"/><use href="#particle" x="339" y="337"/><use href="#particle" x="397" y="259"/>
    </g>
    <use href="#obstacle" x="237" y="251"/><use href="#obstacle" x="425" y="399"/>
    <use href="#blower" x="130" y="436" transform="rotate(28 130 436)"/>
    <use href="#pusher" x="405" y="358" transform="rotate(36 405 358)"/>
    <path d="M445 322C503 302 543 255 568 210" fill="none" stroke="#5671aa" stroke-width="5" marker-end="url(#blue)"/>
    <circle cx="546" cy="247" r="15" fill="#fff" stroke="#6f87b8" stroke-width="2.5"/>
    <path d="M538 247H554M546 239V255" stroke="#6f87b8" stroke-width="2"/>

    <g font-size="18" font-weight="700">
      <rect x="73" y="220" width="153" height="32" rx="7" fill="#fff" fill-opacity=".94"/>
      <text x="84" y="242" fill="#367d83">Broad influence</text>
      <rect x="429" y="435" width="140" height="32" rx="7" fill="#fff" fill-opacity=".94"/>
      <text x="440" y="457" fill="#4a6597">Local contact</text>
    </g>

    <!-- Shared representation, with capability-specific physical actions. -->
    <text x="724" y="115" font-size="21" font-weight="700">From scene to action</text>
    <g transform="translate(741 139)">
      <rect width="112" height="86" rx="9" fill="#f3f7fa" stroke="#bdcbd9" stroke-width="2"/>
      <path d="M11 11H101V75H11Z" fill="none" stroke="#ced9e4" stroke-width="2"/>
      <rect x="76" y="14" width="21" height="19" rx="2" fill="#d78d83"/>
      <rect x="28" y="34" width="20" height="18" fill="#b6c3d3"/>
      <rect x="61" y="47" width="17" height="18" fill="#b6c3d3"/>
      <g fill="#cfaa61"><circle cx="24" cy="65" r="3"/><circle cx="48" cy="22" r="3"/><circle cx="66" cy="33" r="3"/><circle cx="87" cy="62" r="3"/></g>
      <text x="56" y="111" text-anchor="middle" font-size="16" fill="#65768c">Scene map</text>
    </g>
    <path d="M864 180H908" stroke="#8492a6" stroke-width="3" marker-end="url(#gray)"/>
    <text x="886" y="165" text-anchor="middle" font-size="13" fill="#65768c">DQN</text>
    <g transform="translate(923 139)">
      <rect width="138" height="86" rx="9" fill="#eef4f6" stroke="#bdcbd9" stroke-width="2"/>
      <g stroke="#fff" stroke-width="2">
        <path d="M10 10H34V30H10Z" fill="#e0e9ef"/><path d="M34 10H58V30H34Z" fill="#c9dce4"/><path d="M58 10H82V30H58Z" fill="#a7c6ce"/><path d="M82 10H106V30H82Z" fill="#7eafb7"/><path d="M106 10H128V30H106Z" fill="#97bec6"/>
        <path d="M10 30H34V53H10Z" fill="#d0e0e6"/><path d="M34 30H58V53H34Z" fill="#bad3dc"/><path d="M58 30H82V53H58Z" fill="#82aebc"/><path d="M82 30H106V53H82Z" fill="#41818b"/><path d="M106 30H128V53H106Z" fill="#78abb2"/>
        <path d="M10 53H34V76H10Z" fill="#e4ebf0"/><path d="M34 53H58V76H34Z" fill="#d3e1e7"/><path d="M58 53H82V76H58Z" fill="#bed3dd"/><path d="M82 53H106V76H82Z" fill="#9abdc9"/><path d="M106 53H128V76H106Z" fill="#c2d8e1"/>
      </g>
      <path d="M88 41H100M94 35V47" stroke="white" stroke-width="2.5"/>
      <text x="69" y="111" text-anchor="middle" font-size="16" fill="#65768c">Spatial Action Map</text>
    </g>
    <path d="M994 262V284" stroke="#8492a6" stroke-width="3" marker-end="url(#gray)"/>
    <rect x="743" y="297" width="322" height="48" rx="10" fill="#edf1f8" stroke="#b8c5da" stroke-width="2"/>
    <text x="904" y="327" text-anchor="middle" font-size="20" fill="#415f8d" font-weight="700">Select an action endpoint</text>
    <path d="M904 346V365H803V383M904 365H1004V383" fill="none" stroke="#8492a6" stroke-width="2.5" marker-end="url(#gray)"/>
    <rect x="733" y="391" width="145" height="39" rx="9" fill="#e8f2f2" stroke="#b6d3d3"/>
    <text x="805" y="417" text-anchor="middle" font-size="19" fill="#357a81" font-weight="700">BLOW</text>
    <rect x="931" y="391" width="145" height="39" rx="9" fill="#eaf0f8" stroke="#bbcae0"/>
    <text x="1004" y="417" text-anchor="middle" font-size="19" fill="#4b6899" font-weight="700">PUSH</text>

    <!-- Experimental axes, without invented measured curves or success rates. -->
    <text x="28" y="587" font-size="20" font-weight="700">Compare how the team is configured</text>
    <g font-size="17" fill="#566c83">
      <rect x="25" y="604" width="202" height="90" rx="12" fill="#f6f8fa" stroke="#dbe3eb"/>
      <use href="#blower" x="77" y="641" transform="translate(77 641) scale(.37) translate(-77 -641)"/>
      <use href="#pusher" x="160" y="641" transform="translate(160 641) scale(.37) translate(-160 -641)"/>
      <path d="M98 641H135" stroke="#87a1b8" stroke-width="2" marker-end="url(#gray)"/>
      <text x="126" y="677" text-anchor="middle">Capabilities</text>

      <rect x="241" y="604" width="202" height="90" rx="12" fill="#f6f8fa" stroke="#dbe3eb"/>
      <path d="M283 653V622H393V653" fill="none" stroke="#a8b9ca" stroke-width="3"/>
      <circle cx="285" cy="638" r="8" fill="#62a3a7"/><circle cx="338" cy="622" r="8" fill="none" stroke="#8cb7b8" stroke-width="2" stroke-dasharray="3 2"/><circle cx="391" cy="638" r="8" fill="none" stroke="#8cb7b8" stroke-width="2" stroke-dasharray="3 2"/>
      <text x="342" y="677" text-anchor="middle">Placement</text>

      <rect x="457" y="604" width="217" height="90" rx="12" fill="#f6f8fa" stroke="#dbe3eb"/>
      <path d="M491 630C511 610 540 670 560 640S603 611 632 642M491 650C516 668 540 612 566 636S607 671 632 631" fill="none" stroke="#76aaad" stroke-width="2.5"/>
      <circle cx="560" cy="639" r="13" fill="#f9eae6" stroke="#c78c7f"/><path d="M560 632V641M560 645V646" stroke="#b77669" stroke-width="2.5"/>
      <text x="565" y="677" text-anchor="middle">Interference</text>
    </g>
    <text x="28" y="723" font-size="16" fill="#8592a2">Spatial Action Maps · single-frequency DQN</text>
    <text x="28" y="746" font-size="14" fill="#99a3b0">Illustrative mechanism · qualitative course experiments</text>
    <text x="749" y="461" font-size="17" fill="#758397">Original simulation ↘</text>
  </g>
</svg>
